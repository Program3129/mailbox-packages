<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mailbox Packages</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --entry-bg: #f8f9fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .delete-checked {
    margin-left: auto;
    align-self: center;
    padding: 6px 12px;
    border: 1px solid #f3c7c7;
    background: #fff;
    color: var(--danger);
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .delete-checked:hover { background: #fdecec; }
  .delete-checked[hidden] { display: none; }
  .search-box { margin-bottom: 16px; }
  .search-box input {
    width: 100%;
    padding: 10px 12px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 16px;
    background: #fff;
  }
  .search-box input:focus {
    outline: none;
    border-color: var(--accent);
  }
  .search-results {
    margin-top: 8px;
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .search-result {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 8px 12px;
    background: #fff;
    border: 1px solid var(--border);
    border-radius: 8px;
    cursor: pointer;
    font-size: 15px;
  }
  .search-result:hover { background: #eef1f5; }
  .search-result .sr-number { font-weight: 700; }
  .search-result .sr-number.number-high { color: var(--danger); }
  .search-result .sr-label {
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
  }
  .search-result .sr-section {
    margin-left: auto;
    color: var(--muted);
    font-weight: 600;
    text-transform: uppercase;
    font-size: 13px;
    letter-spacing: 0.04em;
  }
  .search-empty {
    color: var(--muted);
    font-size: 14px;
    padding: 4px 2px;
  }
  .entry.flash { animation: flash 1.6s ease-out; }
  @keyframes flash {
    0%, 40% { background: #fff3b0; box-shadow: 0 0 0 2px #f5c518; }
    100% { background: var(--entry-bg); box-shadow: 0 0 0 0 transparent; }
  }
  .app-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
  }
  .total-count {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .sections {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 120px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding-right: 4px;
  }
  .section h2 {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .section h2:hover { background: #eef1f5; }
  .section-count {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    background: var(--entry-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .section-remove,
  .section-move {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--danger);
  }
  .section-remove:hover { background: #fdecec; }
  .section-move {
    color: var(--accent);
    font-size: 14px;
  }
  .section-move:hover { background: #eaf1fe; }
  .section-move:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.5;
  }
  .section-move:disabled:hover { background: #fff; }
  .move-form {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .move-form select {
    flex: 1;
    min-width: 0;
    padding: 6px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13px;
  }
  .move-form .save,
  .move-form .cancel {
    flex-shrink: 0;
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .move-form .save {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .move-form .save:hover { background: var(--accent-dark); }
  .move-form .cancel {
    background: none;
    border: 1px solid var(--border);
  }
  .move-form .cancel:hover { background: #eef1f5; }
  .rename-form {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .rename-form input {
    flex: 1;
    min-width: 0;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    padding-right: 4px;
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .add-row button {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-row button:hover { background: var(--accent-dark); }
  .entries {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--entry-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 4px 6px 8px;
  }
  .entry .number {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .entry .number:hover { background: #eef1f5; }
  .entry .entry-check {
    width: 20px;
    height: 20px;
    margin: 0;
    flex-shrink: 0;
    cursor: pointer;
    accent-color: var(--accent);
  }
  .entry.checked .number {
    opacity: 0.45;
    text-decoration: line-through;
  }
  .entry .number .number-high { color: var(--danger); }
  .entry .number .entry-label {
    color: var(--accent);
    font-weight: 600;
    text-transform: uppercase;
  }
  .entry button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    flex-shrink: 0;
  }
  .entry button:hover { background: #eef1f5; }
  .entry button.delete {
    color: var(--danger);
    border-color: #f3c7c7;
  }
  .entry button.delete:hover { background: #fdecec; }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 6px 2px;
  }

  /* inline edit form (entries) */
  .edit-form {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  .edit-form input {
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
  }
  .edit-form input.number-field { width: 70px; }
  .edit-form input.qty-field { width: 55px; }
  .edit-form .save,
  .rename-form .save {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-form .save:hover,
  .rename-form .save:hover { background: var(--accent-dark); }
  .edit-form .cancel,
  .rename-form .cancel {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-form .cancel:hover,
  .rename-form .cancel:hover { background: #eef1f5; }

  /* add-section card */
  .add-section {
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 120px;
  }
  .add-section-trigger {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 8px;
  }
  .add-section-trigger:hover { color: var(--text); }
  .add-section-form {
    display: flex;
    gap: 8px;
  }
  .add-section-form input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .add-section-form button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  /* undo toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2430;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
    max-width: calc(100vw - 32px);
  }
  #toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #toast button {
    background: none;
    border: none;
    color: #93c5fd;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    flex-shrink: 0;
  }

  [hidden] { display: none !important; }

  /* saved dates */
  .history-bar {
    display: flex;
    gap: 8px;
    flex-wrap: wrap;
    margin-bottom: 12px;
  }
  .save-day {
    padding: 8px 14px;
    border: none;
    border-radius: 8px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .save-day:hover { background: var(--accent-dark); }
  .save-day:disabled { opacity: 0.45; cursor: default; }
  .save-day:disabled:hover { background: var(--accent); }
  .history-select {
    flex: 1;
    min-width: 160px;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 8px;
    font-size: 14px;
    background: #fff;
    color: var(--text);
  }
  .history-banner {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 10px 12px;
    margin-bottom: 12px;
    background: #fff8e1;
    border: 1px solid #f5c518;
    border-radius: 8px;
    font-size: 14px;
  }
  .history-banner span { flex: 1; }
  .pdf-btn {
    padding: 8px 14px;
    border: 1px solid var(--border);
    border-radius: 8px;
    background: #fff;
    color: var(--text);
    font-size: 14px;
    font-weight: 600;
    cursor: pointer;
  }
  .pdf-btn:hover { background: #eef1f5; }
  .pdf-btn:disabled { opacity: 0.45; cursor: default; }
  .pdf-btn:disabled:hover { background: #fff; }
  .history-back {
    padding: 6px 12px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 13px;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .history-back:hover { background: #eef1f5; }
  .viewing-history #sections,
  .viewing-history .search-box,
  .viewing-history .delete-checked,
  .viewing-history .total-count,
  .viewing-history .save-day { display: none !important; }
  .history-view .section h2 { cursor: default; }
  .history-view .section h2:hover { background: none; }
  .history-view .entry .number { cursor: default; }
  .history-view .entry .number:hover { background: none; }
  .history-view .entry-check { cursor: default; }

  /* mobile: one section per row, full-width, easier to read/tap */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .app-header { margin-bottom: 12px; }
    .entry .entry-check { width: 24px; height: 24px; }
    h1 { font-size: 18px; }
    .total-count { font-size: 18px; }
    .sections {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .section, .add-section {
      min-height: 0;
      min-width: 0;
    }
    .entry button,
    .section-remove,
    .section-move,
    .section-count,
    .add-row button {
      width: 32px;
      height: 32px;
      font-size: 16px;
    }
    .add-row button { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="app-header">
    <h1>Mailbox Packages</h1>
    <span id="total-count" class="total-count"></span>
    <button id="delete-checked" class="delete-checked" hidden></button>
  </div>
  <div class="history-bar">
    <button id="save-day" class="save-day" title="Save a snapshot of every section under today's date">Save today</button>
    <select id="history-select" class="history-select" aria-label="View a saved date"></select>
    <button id="pdf-btn" class="pdf-btn" title="Download a PDF of the selected date">PDF</button>
  </div>
  <div id="history-banner" class="history-banner" hidden>
    <span id="history-banner-text"></span>
    <button id="history-back" class="history-back">Back to today</button>
  </div>
  <div class="search-box">
    <input id="master-search" type="search" placeholder="Search mailbox # in all sections" inputmode="numeric" autocomplete="off">
    <div id="search-results" class="search-results" hidden></div>
  </div>
  <div class="sections" id="sections"></div>
  <div class="sections history-view" id="history-sections" hidden></div>
  <div id="toast">
    <span id="toast-msg"></span>
    <button id="toast-undo">Undo</button>
  </div>

<script>
(function () {
  const STORAGE_KEY = "mailboxPackages_v2";
  const DEFAULT_SECTIONS = ["USPS", "UPS", "FedEx", "DHL", "Amazon", "Other"];

  let nextSectionId = 1;
  let nextEntryId = 1;
  let moveSectionId = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.sections)) return parsed;
      }
      // migrate from v1 (object-keyed sections)
      const oldRaw = localStorage.getItem("mailboxPackages_v1");
      if (oldRaw) {
        const oldParsed = JSON.parse(oldRaw);
        if (oldParsed && oldParsed.sections && !Array.isArray(oldParsed.sections)) {
          const sections = Object.keys(oldParsed.sections).map(name => ({
            id: nextSectionId++,
            name,
            entries: oldParsed.sections[name]
          }));
          return { sections };
        }
      }
    } catch (e) {}
    const sections = DEFAULT_SECTIONS.map(name => ({ id: nextSectionId++, name, entries: [] }));
    return { sections };
  }

  let state = loadState();
  state.sections.forEach(section => {
    if (section.id >= nextSectionId) nextSectionId = section.id + 1;
    section.entries.forEach(e => { if (e.id >= nextEntryId) nextEntryId = e.id + 1; });
  });

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function getSection(sectionId) {
    return state.sections.find(s => s.id === sectionId);
  }

  // Splits input like "698.3" into { number: "698", qty: 3 } so typing the
  // same dotted notation the app displays (e.g. after a 698.3 entry) is
  // read as "box 698, quantity 3" instead of becoming a literal "698.3"
  // mailbox number that then displays as "698.3.4" once incremented. Also
  // splits off any trailing free-text note (e.g. "113 usps dhl" -> number
  // "113", label "usps dhl") so it can be shown highlighted separately.
  function parseNumberInput(raw) {
    const trimmed = raw.trim();
    const spaceIdx = trimmed.search(/\s/);
    let numberPart = trimmed;
    let label = null;
    if (spaceIdx !== -1) {
      numberPart = trimmed.slice(0, spaceIdx);
      const rest = trimmed.slice(spaceIdx + 1).trim();
      label = rest ? rest.toUpperCase() : null;
    }

    const lastDot = numberPart.lastIndexOf(".");
    if (lastDot > 0 && lastDot < numberPart.length - 1) {
      const base = numberPart.slice(0, lastDot);
      const suffix = numberPart.slice(lastDot + 1);
      if (/^\d+$/.test(suffix)) {
        const qty = parseInt(suffix, 10);
        if (qty >= 1) return { number: base, qty, label };
      }
    }
    return { number: numberPart, qty: null, label };
  }

  function sortSection(sectionId) {
    getSection(sectionId).entries.sort((a, b) =>
      a.number.localeCompare(b.number, undefined, { numeric: true, sensitivity: "base" })
    );
  }

  let focusInputSectionId = null;

  const searchInput = document.getElementById("master-search");
  const searchResults = document.getElementById("search-results");
  searchInput.addEventListener("input", renderSearchResults);

  function renderSearchResults() {
    const query = parseNumberInput(searchInput.value).number;
    searchResults.innerHTML = "";
    if (!query) {
      searchResults.hidden = true;
      return;
    }
    searchResults.hidden = false;

    const matches = [];
    state.sections.forEach(section => {
      section.entries.forEach(entry => {
        if (entry.number.startsWith(query)) matches.push({ section, entry });
      });
    });

    if (matches.length === 0) {
      const empty = document.createElement("div");
      empty.className = "search-empty";
      empty.textContent = `No mailbox starting with "${query}"`;
      searchResults.appendChild(empty);
      return;
    }

    matches.forEach(({ section, entry }) => {
      const row = document.createElement("div");
      row.className = "search-result";

      const num = document.createElement("span");
      num.className = "sr-number";
      if (parseInt(entry.number, 10) >= 2000) num.classList.add("number-high");
      num.textContent = entry.qty > 1 ? `${entry.number}.${entry.qty}` : entry.number;
      row.appendChild(num);

      if (entry.label) {
        const lbl = document.createElement("span");
        lbl.className = "sr-label";
        lbl.textContent = entry.label;
        row.appendChild(lbl);
      }

      const sec = document.createElement("span");
      sec.className = "sr-section";
      sec.textContent = section.name;
      row.appendChild(sec);

      row.addEventListener("click", () => {
        const target = document.querySelector(`.entry[data-entry-id="${entry.id}"]`);
        if (!target) return;
        target.scrollIntoView({ behavior: "smooth", block: "center" });
        target.classList.remove("flash");
        void target.offsetWidth;
        target.classList.add("flash");
      });

      searchResults.appendChild(row);
    });
  }

  function render() {
    const container = document.getElementById("sections");
    container.innerHTML = "";
    state.sections.forEach(section => {
      container.appendChild(renderSection(section));
    });
    container.appendChild(renderAddSection());

    const total = state.sections.reduce((sum, s) => sum + s.entries.length, 0);
    document.getElementById("total-count").textContent = total;

    const checkedCount = state.sections.reduce(
      (sum, s) => sum + s.entries.filter(e => e.checked).length, 0
    );
    const delChecked = document.getElementById("delete-checked");
    delChecked.hidden = checkedCount === 0;
    delChecked.textContent = `Delete checked (${checkedCount})`;

    saveDayBtn.disabled = total === 0;
    updatePdfBtn();
    saveDayBtn.title = total === 0
      ? "Nothing to save yet"
      : "Save a snapshot of every section under today's date";

    renderSearchResults();

    if (focusInputSectionId !== null) {
      const input = container.querySelector(
        `.section[data-section-id="${focusInputSectionId}"] .add-row input`
      );
      if (input) input.focus();
      focusInputSectionId = null;
    }
  }

  function renderSection(section) {
    const el = document.createElement("div");
    el.className = "section";
    el.dataset.sectionId = section.id;

    const header = document.createElement("div");
    header.className = "section-header";

    const heading = document.createElement("h2");
    heading.textContent = section.name;
    heading.title = "Tap to rename";
    heading.addEventListener("click", () => startRenameSection(section.id, header));
    header.appendChild(heading);

    const count = document.createElement("span");
    count.className = "section-count";
    count.textContent = section.entries.length;
    header.appendChild(count);

    if (state.sections.length > 1) {
      const moveBtn = document.createElement("button");
      moveBtn.className = "section-move";
      moveBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="18" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      if (section.entries.length === 0) {
        moveBtn.disabled = true;
        moveBtn.title = "No packages to move";
      } else {
        moveBtn.title = "Move all packages to another section";
        moveBtn.addEventListener("click", () => {
          moveSectionId = moveSectionId === section.id ? null : section.id;
          render();
        });
      }
      header.appendChild(moveBtn);
    }

    const removeBtn = document.createElement("button");
    removeBtn.className = "section-remove";
    removeBtn.textContent = "✕";
    removeBtn.title = "Delete section";
    removeBtn.addEventListener("click", () => deleteSection(section.id));
    header.appendChild(removeBtn);

    el.appendChild(header);

    if (moveSectionId === section.id) {
      el.appendChild(renderMoveForm(section));
    }

    const addRow = document.createElement("div");
    addRow.className = "add-row";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Mailbox #";
    input.inputMode = "numeric";
    const addBtn = document.createElement("button");
    addBtn.textContent = "+";
    addBtn.title = "Add";
    const doAdd = () => {
      const value = input.value.trim();
      if (!value) return;
      focusInputSectionId = section.id;
      addPackage(section.id, value);
    };
    addBtn.addEventListener("click", doAdd);
    input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    el.appendChild(addRow);

    const entriesEl = document.createElement("div");
    entriesEl.className = "entries";

    if (section.entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No packages";
      entriesEl.appendChild(empty);
    } else {
      section.entries.forEach(entry => {
        entriesEl.appendChild(renderEntry(section.id, entry));
      });
    }

    el.appendChild(entriesEl);
    return el;
  }

  function renderAddSection() {
    const el = document.createElement("div");
    el.className = "add-section";

    const trigger = document.createElement("button");
    trigger.className = "add-section-trigger";
    trigger.textContent = "+ Add Section";
    trigger.addEventListener("click", () => {
      el.innerHTML = "";
      const form = document.createElement("div");
      form.className = "add-section-form";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Section name";
      const addBtn = document.createElement("button");
      addBtn.textContent = "Add";
      const doAdd = () => {
        const value = input.value.trim();
        if (!value) return;
        addSection(value);
      };
      addBtn.addEventListener("click", doAdd);
      input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
      form.appendChild(input);
      form.appendChild(addBtn);
      el.appendChild(form);
      input.focus();
    });

    el.appendChild(trigger);
    return el;
  }

  function renderMoveForm(section) {
    const form = document.createElement("div");
    form.className = "move-form";

    const select = document.createElement("select");
    state.sections
      .filter(s => s.id !== section.id)
      .forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });

    const moveBtn = document.createElement("button");
    moveBtn.className = "save";
    moveBtn.textContent = "Move";
    moveBtn.addEventListener("click", () => {
      moveSectionId = null;
      moveAllToSection(section.id, parseInt(select.value, 10));
    });

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => {
      moveSectionId = null;
      render();
    });

    form.appendChild(select);
    form.appendChild(moveBtn);
    form.appendChild(cancelBtn);
    return form;
  }

  function moveAllToSection(sourceId, destId) {
    const source = getSection(sourceId);
    const dest = getSection(destId);
    if (!source || !dest || source.entries.length === 0) return;

    const sourceBefore = source.entries.map(e => ({ ...e }));
    const destBefore = dest.entries.map(e => ({ ...e }));

    source.entries.forEach(entry => {
      const existing = dest.entries.find(e => e.number === entry.number);
      if (existing) {
        existing.qty += entry.qty;
        if (entry.label) existing.label = entry.label;
      } else {
        dest.entries.push({ id: nextEntryId++, number: entry.number, qty: entry.qty, label: entry.label, checked: entry.checked });
      }
    });
    source.entries = [];
    sortSection(destId);

    save();
    render();
    showUndoToast({
      message: `Moved ${sourceBefore.length} ${sourceBefore.length === 1 ? "number" : "numbers"} from "${source.name}" to "${dest.name}"`,
      undo: () => {
        source.entries = sourceBefore;
        dest.entries = destBefore;
      }
    });
  }

  function startRenameSection(sectionId, header) {
    const section = getSection(sectionId);
    if (!section) return;

    header.innerHTML = "";
    const form = document.createElement("div");
    form.className = "rename-form";

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = section.name;

    const saveBtn = document.createElement("button");
    saveBtn.className = "save";
    saveBtn.textContent = "Save";
    saveBtn.addEventListener("click", () => commitRenameSection(sectionId, nameInput.value));

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", render);

    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") commitRenameSection(sectionId, nameInput.value);
      if (e.key === "Escape") render();
    });

    form.appendChild(nameInput);
    form.appendChild(saveBtn);
    form.appendChild(cancelBtn);
    header.appendChild(form);
    nameInput.focus();
    nameInput.select();
  }

  function commitRenameSection(sectionId, newNameRaw) {
    const newName = newNameRaw.trim();
    if (!newName) return;
    const section = getSection(sectionId);
    if (!section) return;
    section.name = newName;
    save();
    render();
  }

  function addSection(name) {
    state.sections.push({ id: nextSectionId++, name, entries: [] });
    save();
    render();
  }

  let pendingDelete = null;
  let toastTimer = null;

  function deleteSection(sectionId) {
    const idx = state.sections.findIndex(s => s.id === sectionId);
    if (idx === -1) return;
    const [removed] = state.sections.splice(idx, 1);
    const removedIndex = idx;
    save();
    render();
    showUndoToast({
      type: "section",
      message: `Deleted section "${removed.name}"`,
      undo: () => {
        state.sections.splice(removedIndex, 0, removed);
      }
    });
  }

  function renderEntry(sectionId, entry) {
    const row = document.createElement("div");
    row.className = "entry";
    row.dataset.entryId = entry.id;
    if (entry.checked) row.classList.add("checked");

    const check = document.createElement("input");
    check.type = "checkbox";
    check.className = "entry-check";
    check.checked = !!entry.checked;
    check.title = "Check off";
    check.addEventListener("change", () => {
      entry.checked = check.checked;
      save();
      render();
    });
    row.appendChild(check);

    const label = buildEntryLabel(entry);
    label.title = "Tap to edit";
    label.addEventListener("click", () => startEdit(sectionId, entry.id, row));
    row.appendChild(label);

    const minusBtn = document.createElement("button");
    minusBtn.textContent = "−";
    minusBtn.addEventListener("click", () => changeQty(sectionId, entry.id, -1));
    row.appendChild(minusBtn);

    const plusBtn = document.createElement("button");
    plusBtn.textContent = "+";
    plusBtn.addEventListener("click", () => changeQty(sectionId, entry.id, 1));
    row.appendChild(plusBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "delete";
    delBtn.textContent = "✕";
    delBtn.title = "Delete";
    delBtn.addEventListener("click", () => deleteEntry(sectionId, entry.id));
    row.appendChild(delBtn);

    return row;
  }

  function startEdit(sectionId, id, row) {
    const entry = getSection(sectionId).entries.find(e => e.id === id);
    if (!entry) return;

    row.innerHTML = "";
    const form = document.createElement("div");
    form.className = "edit-form";

    const numberInput = document.createElement("input");
    numberInput.className = "number-field";
    numberInput.type = "text";
    numberInput.value = entry.label ? `${entry.number} ${entry.label}` : entry.number;

    const qtyInput = document.createElement("input");
    qtyInput.className = "qty-field";
    qtyInput.type = "number";
    qtyInput.min = "1";
    qtyInput.value = entry.qty;

    const saveBtn = document.createElement("button");
    saveBtn.className = "save";
    saveBtn.textContent = "Save";
    saveBtn.addEventListener("click", () => commitEdit(sectionId, id, numberInput.value, qtyInput.value));

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", render);

    form.appendChild(numberInput);
    form.appendChild(qtyInput);
    form.appendChild(saveBtn);
    form.appendChild(cancelBtn);
    row.appendChild(form);
    numberInput.focus();
  }

  function commitEdit(sectionId, id, newNumberRaw, newQtyRaw) {
    const parsed = parseNumberInput(newNumberRaw);
    const newNumber = parsed.number;
    if (!newNumber) return;
    let newQty = parsed.qty;
    if (newQty === null) {
      newQty = parseInt(newQtyRaw, 10);
      if (isNaN(newQty) || newQty < 1) newQty = 1;
    }

    const list = getSection(sectionId).entries;
    const entry = list.find(e => e.id === id);
    if (!entry) return;

    const duplicate = list.find(e => e.id !== id && e.number === newNumber);
    if (duplicate) {
      duplicate.qty += newQty;
      if (parsed.label) duplicate.label = parsed.label;
      const idx = list.indexOf(entry);
      list.splice(idx, 1);
    } else {
      entry.number = newNumber;
      entry.qty = newQty;
      entry.label = parsed.label;
    }

    sortSection(sectionId);
    save();
    render();
  }

  function addPackage(sectionId, rawNumber) {
    const parsed = parseNumberInput(rawNumber);
    const list = getSection(sectionId).entries;
    const existing = list.find(e => e.number === parsed.number);
    if (existing) {
      existing.qty += 1;
      if (parsed.label) existing.label = parsed.label;
    } else {
      list.push({ id: nextEntryId++, number: parsed.number, qty: parsed.qty || 1, label: parsed.label });
    }
    sortSection(sectionId);
    save();
    render();
  }

  function changeQty(sectionId, id, delta) {
    const entry = getSection(sectionId).entries.find(e => e.id === id);
    if (!entry) return;
    entry.qty = Math.max(1, entry.qty + delta);
    save();
    render();
  }

  function deleteEntry(sectionId, id) {
    const list = getSection(sectionId).entries;
    const idx = list.findIndex(e => e.id === id);
    if (idx === -1) return;
    const [removed] = list.splice(idx, 1);
    save();
    render();
    showUndoToast({
      type: "entry",
      message: `Deleted mailbox ${removed.number} from ${getSection(sectionId).name}`,
      undo: () => {
        list.push(removed);
        sortSection(sectionId);
      }
    });
  }

  function deleteCheckedEntries() {
    const removedBySection = [];
    state.sections.forEach(section => {
      const removed = section.entries.filter(e => e.checked);
      if (removed.length === 0) return;
      section.entries = section.entries.filter(e => !e.checked);
      removedBySection.push({ section, removed });
    });
    if (removedBySection.length === 0) return;

    const count = removedBySection.reduce((sum, r) => sum + r.removed.length, 0);
    save();
    render();
    showUndoToast({
      type: "checked",
      message: `Deleted ${count} checked ${count === 1 ? "entry" : "entries"}`,
      undo: () => {
        removedBySection.forEach(({ section, removed }) => {
          section.entries.push(...removed);
          sortSection(section.id);
        });
      }
    });
  }

  document.getElementById("delete-checked").addEventListener("click", deleteCheckedEntries);

  function showUndoToast(action) {
    pendingDelete = action;
    const toast = document.getElementById("toast");
    const msg = document.getElementById("toast-msg");
    msg.textContent = action.message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
      pendingDelete = null;
    }, 5000);
  }

  document.getElementById("toast-undo").addEventListener("click", () => {
    if (!pendingDelete) return;
    pendingDelete.undo();
    save();
    render();
    document.getElementById("toast").classList.remove("show");
    clearTimeout(toastTimer);
    pendingDelete = null;
  });

  function buildEntryLabel(entry) {
    const label = document.createElement("div");
    label.className = "number";

    const numberSpan = document.createElement("span");
    if (parseInt(entry.number, 10) >= 2000) numberSpan.classList.add("number-high");
    numberSpan.textContent = entry.qty > 1 ? `${entry.number}.${entry.qty}` : entry.number;
    label.appendChild(numberSpan);

    if (entry.label) {
      const labelSpan = document.createElement("span");
      labelSpan.className = "entry-label";
      labelSpan.textContent = " " + entry.label;
      label.appendChild(labelSpan);
    }
    return label;
  }

  // ---- saved dates (snapshots of every section, one per calendar day) ----
  const HISTORY_KEY = "mailboxPackages_history_v1";
  const saveDayBtn = document.getElementById("save-day");
  const historySelect = document.getElementById("history-select");
  const historyBanner = document.getElementById("history-banner");
  const historyBannerText = document.getElementById("history-banner-text");
  const historySections = document.getElementById("history-sections");
  let viewingDayKey = null;

  function loadSavedDays() {
    try {
      const raw = localStorage.getItem(HISTORY_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && typeof parsed === "object") return parsed;
      }
    } catch (e) {}
    return {};
  }
  const savedDays = loadSavedDays();

  function persistSavedDays() {
    try {
      localStorage.setItem(HISTORY_KEY, JSON.stringify(savedDays));
    } catch (e) {}
  }

  function todayKey() {
    const d = new Date();
    const pad = n => String(n).padStart(2, "0");
    return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}`;
  }

  function formatDayKey(key) {
    const [y, m, d] = key.split("-").map(Number);
    return new Date(y, m - 1, d).toLocaleDateString(undefined, {
      weekday: "short", month: "short", day: "numeric", year: "numeric"
    });
  }

  function refreshHistorySelect() {
    const keys = Object.keys(savedDays).sort().reverse();
    historySelect.innerHTML = "";
    const placeholder = document.createElement("option");
    placeholder.value = "";
    placeholder.textContent = keys.length ? "View a saved date…" : "No saved dates yet";
    historySelect.appendChild(placeholder);
    keys.forEach(key => {
      const opt = document.createElement("option");
      opt.value = key;
      opt.textContent = formatDayKey(key);
      historySelect.appendChild(opt);
    });
    historySelect.disabled = keys.length === 0;
    historySelect.value = viewingDayKey || "";
  }

  function renderHistoryView() {
    const snap = savedDays[viewingDayKey];
    if (!snap) {
      exitHistoryView();
      return;
    }
    historySections.innerHTML = "";
    let total = 0;

    snap.sections.forEach(section => {
      total += section.entries.length;
      const el = document.createElement("div");
      el.className = "section";

      const header = document.createElement("div");
      header.className = "section-header";
      const heading = document.createElement("h2");
      heading.textContent = section.name;
      header.appendChild(heading);
      const count = document.createElement("span");
      count.className = "section-count";
      count.textContent = section.entries.length;
      header.appendChild(count);
      el.appendChild(header);

      const entriesEl = document.createElement("div");
      entriesEl.className = "entries";
      if (section.entries.length === 0) {
        const empty = document.createElement("div");
        empty.className = "empty";
        empty.textContent = "No packages";
        entriesEl.appendChild(empty);
      } else {
        section.entries.forEach(entry => {
          const row = document.createElement("div");
          row.className = "entry";
          if (entry.checked) row.classList.add("checked");
          const check = document.createElement("input");
          check.type = "checkbox";
          check.className = "entry-check";
          check.checked = !!entry.checked;
          check.disabled = true;
          row.appendChild(check);
          row.appendChild(buildEntryLabel(entry));
          entriesEl.appendChild(row);
        });
      }
      el.appendChild(entriesEl);
      historySections.appendChild(el);
    });

    const time = new Date(snap.savedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
    historyBannerText.textContent =
      `${formatDayKey(viewingDayKey)} · saved ${time} · ${total} ${total === 1 ? "entry" : "entries"} · read-only`;
  }

  function enterHistoryView(key) {
    viewingDayKey = key;
    document.body.classList.add("viewing-history");
    historyBanner.hidden = false;
    historySections.hidden = false;
    renderHistoryView();
    refreshHistorySelect();
    updatePdfBtn();
  }

  function exitHistoryView() {
    viewingDayKey = null;
    document.body.classList.remove("viewing-history");
    historyBanner.hidden = true;
    historySections.hidden = true;
    historySections.innerHTML = "";
    refreshHistorySelect();
    updatePdfBtn();
  }

  function saveToday() {
    const total = state.sections.reduce((sum, s) => sum + s.entries.length, 0);
    if (total === 0) return;
    const key = todayKey();
    const prev = savedDays[key];
    savedDays[key] = { savedAt: Date.now(), sections: JSON.parse(JSON.stringify(state.sections)) };
    persistSavedDays();
    refreshHistorySelect();
    showUndoToast({
      message: `Saved ${formatDayKey(key)}${prev ? " (replaced earlier save)" : ""}`,
      undo: () => {
        if (prev) savedDays[key] = prev;
        else delete savedDays[key];
        persistSavedDays();
        if (viewingDayKey === key && !savedDays[key]) exitHistoryView();
        else if (viewingDayKey === key) renderHistoryView();
        refreshHistorySelect();
      }
    });
  }

  // ---- PDF export: built by hand (no libraries) using the built-in Helvetica fonts ----
  // Helvetica-Bold glyph widths for ASCII 32..126, used only to truncate long notes.
  const HELV_BOLD_WIDTHS = [
    278,333,474,556,556,889,722,238,333,333,389,584,278,333,278,278,
    556,556,556,556,556,556,556,556,556,556,
    333,333,584,584,584,611,975,
    722,722,722,722,667,611,778,722,278,556,722,611,833,722,778,667,778,722,667,611,722,667,944,667,667,611,
    333,278,333,584,556,333,
    556,611,556,611,556,333,611,611,278,278,556,278,889,611,611,611,611,389,556,333,611,556,778,556,556,500,
    389,280,389,584
  ];
  const WIN_ANSI_EXTRAS = { 0x2018: 0x91, 0x2019: 0x92, 0x201C: 0x93, 0x201D: 0x94, 0x2013: 0x96, 0x2014: 0x97, 0x2022: 0x95, 0x2026: 0x85, 0x20AC: 0x80 };

  // Characters the built-in fonts can't draw (e.g. Korean) become "?".
  function toWinAnsi(str) {
    let out = "";
    for (const ch of String(str)) {
      let c = ch.codePointAt(0);
      if (c === 0x202F || (c >= 0x2000 && c <= 0x200A)) c = 0x20;
      if ((c >= 0x20 && c <= 0x7E) || (c >= 0xA0 && c <= 0xFF)) out += String.fromCharCode(c);
      else if (WIN_ANSI_EXTRAS[c]) out += String.fromCharCode(WIN_ANSI_EXTRAS[c]);
      else out += "?";
    }
    return out;
  }

  function pdfEscape(str) {
    return str.replace(/[\\()]/g, m => "\\" + m);
  }

  function pdfWidth(str, size) {
    let w = 0;
    for (let i = 0; i < str.length; i++) {
      const c = str.charCodeAt(i);
      w += (c >= 32 && c <= 126) ? HELV_BOLD_WIDTHS[c - 32] : 556;
    }
    return w * size / 1000;
  }

  function buildPdf(subtitle, sections) {
    const W = 612, H = 792, M = 40, COLS = 3, GAP = 10, ROW = 19, BOTTOM = 52;
    const cellW = (W - 2 * M - GAP * (COLS - 1)) / COLS;
    const DARK = "0.12 0.14 0.19", MUTED = "0.42 0.45 0.50", GRAY = "0.62 0.65 0.69";
    const RED = "0.86 0.15 0.15", BLUE = "0.15 0.39 0.92";
    const n = v => v.toFixed(2);
    const esc = s => pdfEscape(toWinAnsi(s));

    const pages = [];
    let ops, y;
    function newPage() {
      ops = [];
      pages.push(ops);
      y = H - M;
    }

    function heading(name, count, continued) {
      ops.push(
        `BT /F2 12 Tf ${DARK} rg ${n(M)} ${n(y - 12)} Td (${esc(name.toUpperCase())}) Tj ` +
        `/F1 10 Tf ${MUTED} rg (${esc("  (" + count + (continued ? ", continued" : "") + ")")}) Tj ET`
      );
      ops.push(`0.87 0.89 0.91 RG 0.8 w ${n(M)} ${n(y - 18)} m ${n(W - M)} ${n(y - 18)} l S`);
      y -= 26;
    }

    function drawEntry(entry, x) {
      const yb = y - 13;
      ops.push(`${GRAY} RG 0.7 w ${n(x)} ${n(yb - 1.5)} 9 9 re S`);
      if (entry.checked) {
        ops.push(`${BLUE} RG 1.4 w ${n(x + 1.8)} ${n(yb + 3)} m ${n(x + 3.8)} ${n(yb + 0.8)} l ${n(x + 7.6)} ${n(yb + 6.4)} l S`);
      }
      const avail = cellW - 15 - 2;
      let num = toWinAnsi(entry.qty > 1 ? `${entry.number}.${entry.qty}` : entry.number);
      let label = entry.label ? toWinAnsi(" " + entry.label.toUpperCase()) : "";
      while (num.length > 1 && pdfWidth(num, 11) > avail) num = num.slice(0, -1);
      const wn = pdfWidth(num, 11);
      if (label && wn + pdfWidth(label, 9) > avail) {
        while (label.length > 1 && wn + pdfWidth(label + "...", 9) > avail) label = label.slice(0, -1);
        label += "...";
      }
      const high = parseInt(entry.number, 10) >= 2000;
      const numColor = entry.checked ? GRAY : (high ? RED : DARK);
      const lblColor = entry.checked ? GRAY : BLUE;
      ops.push(
        `BT /F2 11 Tf ${numColor} rg ${n(x + 15)} ${n(yb)} Td (${pdfEscape(num)}) Tj ` +
        `/F2 9 Tf ${lblColor} rg (${pdfEscape(label)}) Tj ET`
      );
    }

    newPage();
    ops.push(`BT /F2 20 Tf ${DARK} rg ${n(M)} ${n(y - 18)} Td (Mailbox Packages) Tj ET`);
    y -= 28;
    ops.push(`BT /F1 11 Tf ${MUTED} rg ${n(M)} ${n(y - 10)} Td (${esc(subtitle)}) Tj ET`);
    y -= 24;

    sections.forEach(section => {
      const entries = section.entries;
      const count = entries.length;
      if (y - (26 + ROW) < BOTTOM) newPage();
      heading(section.name, count, false);

      if (count === 0) {
        ops.push(`BT /F1 10 Tf ${MUTED} rg ${n(M)} ${n(y - 12)} Td (No packages) Tj ET`);
        y -= 22;
      }
      for (let i = 0; i < count; i += COLS) {
        if (y - ROW < BOTTOM) {
          newPage();
          heading(section.name, count, true);
        }
        entries.slice(i, i + COLS).forEach((entry, c) => drawEntry(entry, M + c * (cellW + GAP)));
        y -= ROW;
      }
      y -= 12;
    });

    pages.forEach((pageOps, i) => {
      pageOps.push(`BT /F1 9 Tf ${MUTED} rg ${n(M)} 26 Td (Page ${i + 1} of ${pages.length}) Tj ET`);
    });

    const objs = [
      "<< /Type /Catalog /Pages 2 0 R >>",
      `<< /Type /Pages /Kids [${pages.map((_, i) => `${5 + 2 * i} 0 R`).join(" ")}] /Count ${pages.length} >>`,
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica /Encoding /WinAnsiEncoding >>",
      "<< /Type /Font /Subtype /Type1 /BaseFont /Helvetica-Bold /Encoding /WinAnsiEncoding >>"
    ];
    pages.forEach((pageOps, i) => {
      const content = pageOps.join("\n");
      objs.push(
        `<< /Type /Page /Parent 2 0 R /MediaBox [0 0 ${W} ${H}] ` +
        `/Resources << /Font << /F1 3 0 R /F2 4 0 R >> >> /Contents ${6 + 2 * i} 0 R >>`
      );
      objs.push(`<< /Length ${content.length} >>\nstream\n${content}\nendstream`);
    });

    let pdf = "%PDF-1.4\n%\xE2\xE3\xCF\xD3\n";
    const offsets = [];
    objs.forEach((body, i) => {
      offsets.push(pdf.length);
      pdf += `${i + 1} 0 obj\n${body}\nendobj\n`;
    });
    const xrefPos = pdf.length;
    pdf += `xref\n0 ${objs.length + 1}\n0000000000 65535 f \n`;
    offsets.forEach(o => { pdf += String(o).padStart(10, "0") + " 00000 n \n"; });
    pdf += `trailer\n<< /Size ${objs.length + 1} /Root 1 0 R >>\nstartxref\n${xrefPos}\n%%EOF\n`;

    const bytes = new Uint8Array(pdf.length);
    for (let i = 0; i < pdf.length; i++) bytes[i] = pdf.charCodeAt(i) & 0xFF;
    return bytes;
  }

  function updatePdfBtn() {
    const pdfBtn = document.getElementById("pdf-btn");
    const liveTotal = state.sections.reduce((sum, s) => sum + s.entries.length, 0);
    pdfBtn.disabled = !viewingDayKey && liveTotal === 0;
    pdfBtn.title = viewingDayKey
      ? `Download a PDF of ${formatDayKey(viewingDayKey)}`
      : "Download a PDF of today's current list (pick a saved date first to export that day instead)";
  }

  function downloadPdf() {
    let sections, subtitle, fileKey;
    const snap = viewingDayKey && savedDays[viewingDayKey];
    if (snap) {
      sections = snap.sections;
      const time = new Date(snap.savedAt).toLocaleTimeString(undefined, { hour: "numeric", minute: "2-digit" });
      subtitle = `${formatDayKey(viewingDayKey)} - saved ${time}`;
      fileKey = viewingDayKey;
    } else {
      sections = state.sections;
      subtitle = `${formatDayKey(todayKey())} - current list`;
      fileKey = todayKey();
    }
    const total = sections.reduce((sum, s) => sum + s.entries.length, 0);
    subtitle += ` - ${total} ${total === 1 ? "entry" : "entries"}`;

    const blob = new Blob([buildPdf(subtitle, sections)], { type: "application/pdf" });
    const url = URL.createObjectURL(blob);
    const a = document.createElement("a");
    a.href = url;
    a.download = `mailbox-packages-${fileKey}.pdf`;
    document.body.appendChild(a);
    a.click();
    a.remove();
    setTimeout(() => URL.revokeObjectURL(url), 10000);
  }

  document.getElementById("pdf-btn").addEventListener("click", downloadPdf);
  saveDayBtn.addEventListener("click", saveToday);
  historySelect.addEventListener("change", () => {
    if (historySelect.value) enterHistoryView(historySelect.value);
    else exitHistoryView();
  });
  document.getElementById("history-back").addEventListener("click", exitHistoryView);

  state.sections.forEach(s => sortSection(s.id));
  refreshHistorySelect();
  render();
})();
</script>
</body>
</html>
