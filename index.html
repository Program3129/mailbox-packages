<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mailbox Packages</title>
<style>
  :root {
    --bg: #f4f5f7;
    --card-bg: #ffffff;
    --border: #dfe3e8;
    --text: #1f2430;
    --muted: #6b7280;
    --accent: #2563eb;
    --accent-dark: #1d4ed8;
    --danger: #dc2626;
    --danger-dark: #b91c1c;
    --entry-bg: #f8f9fb;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    padding: 24px;
  }
  .app-header {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 20px;
  }
  h1 {
    font-size: 22px;
    margin: 0;
  }
  .total-count {
    font-size: 22px;
    font-weight: 700;
    color: var(--text);
  }
  .sections {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(260px, 1fr));
    gap: 16px;
  }
  .section {
    background: var(--card-bg);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    min-height: 120px;
  }
  .section-header {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    padding-right: 4px;
  }
  .section h2 {
    flex: 1;
    font-size: 17px;
    font-weight: 600;
    margin: 0;
    color: var(--muted);
    text-transform: uppercase;
    letter-spacing: 0.04em;
    cursor: pointer;
    padding: 2px 4px;
    border-radius: 4px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    min-width: 0;
  }
  .section h2:hover { background: #eef1f5; }
  .section-count {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    color: var(--muted);
    background: var(--entry-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
  }
  .section-remove,
  .section-move {
    flex-shrink: 0;
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 12px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--danger);
  }
  .section-remove:hover { background: #fdecec; }
  .section-move {
    color: var(--accent);
    font-size: 14px;
  }
  .section-move:hover { background: #eaf1fe; }
  .section-move:disabled {
    color: var(--muted);
    cursor: default;
    opacity: 0.5;
  }
  .section-move:disabled:hover { background: #fff; }
  .move-form {
    display: flex;
    align-items: center;
    gap: 6px;
    margin-bottom: 10px;
    flex-wrap: wrap;
  }
  .move-form select {
    flex: 1;
    min-width: 0;
    padding: 6px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 13px;
  }
  .move-form .save,
  .move-form .cancel {
    flex-shrink: 0;
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
  }
  .move-form .save {
    background: var(--accent);
    color: #fff;
    border: none;
  }
  .move-form .save:hover { background: var(--accent-dark); }
  .move-form .cancel {
    background: none;
    border: 1px solid var(--border);
  }
  .move-form .cancel:hover { background: #eef1f5; }
  .rename-form {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
    min-width: 0;
  }
  .rename-form input {
    flex: 1;
    min-width: 0;
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
  }
  .add-row {
    display: flex;
    gap: 8px;
    margin-bottom: 10px;
    padding-right: 4px;
  }
  .add-row input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .add-row button {
    width: 28px;
    height: 28px;
    flex-shrink: 0;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 18px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
  }
  .add-row button:hover { background: var(--accent-dark); }
  .entries {
    display: flex;
    flex-direction: column;
    gap: 6px;
  }
  .entry {
    display: flex;
    align-items: center;
    gap: 6px;
    background: var(--entry-bg);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 6px 4px 6px 8px;
  }
  .entry .number {
    flex: 1;
    font-size: 15px;
    font-weight: 700;
    font-variant-numeric: tabular-nums;
    cursor: pointer;
    padding: 4px 6px;
    border-radius: 4px;
  }
  .entry .number:hover { background: #eef1f5; }
  .entry button {
    width: 28px;
    height: 28px;
    border: 1px solid var(--border);
    background: #fff;
    border-radius: 6px;
    font-size: 14px;
    line-height: 1;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    color: var(--text);
    flex-shrink: 0;
  }
  .entry button:hover { background: #eef1f5; }
  .entry button.delete {
    color: var(--danger);
    border-color: #f3c7c7;
  }
  .entry button.delete:hover { background: #fdecec; }
  .empty {
    color: var(--muted);
    font-size: 13px;
    padding: 6px 2px;
  }

  /* inline edit form (entries) */
  .edit-form {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: 1;
  }
  .edit-form input {
    padding: 5px 7px;
    border: 1px solid var(--border);
    border-radius: 5px;
    font-size: 14px;
  }
  .edit-form input.number-field { width: 70px; }
  .edit-form input.qty-field { width: 55px; }
  .edit-form .save,
  .rename-form .save {
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-form .save:hover,
  .rename-form .save:hover { background: var(--accent-dark); }
  .edit-form .cancel,
  .rename-form .cancel {
    background: none;
    border: 1px solid var(--border);
    border-radius: 5px;
    padding: 5px 10px;
    font-size: 13px;
    cursor: pointer;
    flex-shrink: 0;
  }
  .edit-form .cancel:hover,
  .rename-form .cancel:hover { background: #eef1f5; }

  /* add-section card */
  .add-section {
    background: transparent;
    border: 1px dashed var(--border);
    border-radius: 10px;
    padding: 14px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    min-height: 120px;
  }
  .add-section-trigger {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 14px;
    cursor: pointer;
    padding: 8px;
  }
  .add-section-trigger:hover { color: var(--text); }
  .add-section-form {
    display: flex;
    gap: 8px;
  }
  .add-section-form input {
    flex: 1;
    min-width: 0;
    padding: 8px 10px;
    border: 1px solid var(--border);
    border-radius: 6px;
    font-size: 14px;
  }
  .add-section-form button {
    padding: 8px 14px;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    font-size: 14px;
    cursor: pointer;
  }

  /* undo toast */
  #toast {
    position: fixed;
    bottom: 24px;
    left: 50%;
    transform: translateX(-50%) translateY(20px);
    background: #1f2430;
    color: #fff;
    padding: 10px 16px;
    border-radius: 8px;
    font-size: 14px;
    display: flex;
    align-items: center;
    gap: 14px;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s ease, transform 0.2s ease;
    z-index: 100;
    max-width: calc(100vw - 32px);
  }
  #toast.show {
    opacity: 1;
    pointer-events: auto;
    transform: translateX(-50%) translateY(0);
  }
  #toast button {
    background: none;
    border: none;
    color: #93c5fd;
    font-size: 14px;
    cursor: pointer;
    font-weight: 600;
    flex-shrink: 0;
  }

  /* mobile: one section per row, full-width, easier to read/tap */
  @media (max-width: 640px) {
    body { padding: 12px; }
    .app-header { margin-bottom: 12px; }
    h1 { font-size: 18px; }
    .total-count { font-size: 18px; }
    .sections {
      grid-template-columns: 1fr;
      gap: 10px;
    }
    .section, .add-section {
      min-height: 0;
      min-width: 0;
    }
    .entry button,
    .section-remove,
    .section-move,
    .section-count,
    .add-row button {
      width: 32px;
      height: 32px;
      font-size: 16px;
    }
    .add-row button { font-size: 20px; }
  }
</style>
</head>
<body>
  <div class="app-header">
    <h1>Mailbox Packages</h1>
    <span id="total-count" class="total-count"></span>
  </div>
  <div class="sections" id="sections"></div>
  <div id="toast">
    <span id="toast-msg"></span>
    <button id="toast-undo">Undo</button>
  </div>

<script>
(function () {
  const STORAGE_KEY = "mailboxPackages_v2";
  const DEFAULT_SECTIONS = ["USPS", "UPS", "FedEx", "DHL", "Amazon", "Other"];

  let nextSectionId = 1;
  let nextEntryId = 1;
  let moveSectionId = null;

  function loadState() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) {
        const parsed = JSON.parse(raw);
        if (parsed && Array.isArray(parsed.sections)) return parsed;
      }
      // migrate from v1 (object-keyed sections)
      const oldRaw = localStorage.getItem("mailboxPackages_v1");
      if (oldRaw) {
        const oldParsed = JSON.parse(oldRaw);
        if (oldParsed && oldParsed.sections && !Array.isArray(oldParsed.sections)) {
          const sections = Object.keys(oldParsed.sections).map(name => ({
            id: nextSectionId++,
            name,
            entries: oldParsed.sections[name]
          }));
          return { sections };
        }
      }
    } catch (e) {}
    const sections = DEFAULT_SECTIONS.map(name => ({ id: nextSectionId++, name, entries: [] }));
    return { sections };
  }

  let state = loadState();
  state.sections.forEach(section => {
    if (section.id >= nextSectionId) nextSectionId = section.id + 1;
    section.entries.forEach(e => { if (e.id >= nextEntryId) nextEntryId = e.id + 1; });
  });

  function save() {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
    } catch (e) {}
  }

  function getSection(sectionId) {
    return state.sections.find(s => s.id === sectionId);
  }

  // Splits input like "698.3" into { number: "698", qty: 3 } so typing the
  // same dotted notation the app displays (e.g. after a 698.3 entry) is
  // read as "box 698, quantity 3" instead of becoming a literal "698.3"
  // mailbox number that then displays as "698.3.4" once incremented.
  function parseNumberInput(raw) {
    const trimmed = raw.trim();
    const lastDot = trimmed.lastIndexOf(".");
    if (lastDot > 0 && lastDot < trimmed.length - 1) {
      const base = trimmed.slice(0, lastDot);
      const suffix = trimmed.slice(lastDot + 1);
      if (/^\d+$/.test(suffix)) {
        const qty = parseInt(suffix, 10);
        if (qty >= 1) return { number: base, qty };
      }
    }
    return { number: trimmed, qty: null };
  }

  function sortSection(sectionId) {
    getSection(sectionId).entries.sort((a, b) =>
      a.number.localeCompare(b.number, undefined, { numeric: true, sensitivity: "base" })
    );
  }

  let focusInputSectionId = null;

  function render() {
    const container = document.getElementById("sections");
    container.innerHTML = "";
    state.sections.forEach(section => {
      container.appendChild(renderSection(section));
    });
    container.appendChild(renderAddSection());

    const total = state.sections.reduce((sum, s) => sum + s.entries.length, 0);
    document.getElementById("total-count").textContent = total;

    if (focusInputSectionId !== null) {
      const input = container.querySelector(
        `.section[data-section-id="${focusInputSectionId}"] .add-row input`
      );
      if (input) input.focus();
      focusInputSectionId = null;
    }
  }

  function renderSection(section) {
    const el = document.createElement("div");
    el.className = "section";
    el.dataset.sectionId = section.id;

    const header = document.createElement("div");
    header.className = "section-header";

    const heading = document.createElement("h2");
    heading.textContent = section.name;
    heading.title = "Tap to rename";
    heading.addEventListener("click", () => startRenameSection(section.id, header));
    header.appendChild(heading);

    const count = document.createElement("span");
    count.className = "section-count";
    count.textContent = section.entries.length;
    header.appendChild(count);

    if (state.sections.length > 1) {
      const moveBtn = document.createElement("button");
      moveBtn.className = "section-move";
      moveBtn.innerHTML = '<svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="12" x2="18" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';
      if (section.entries.length === 0) {
        moveBtn.disabled = true;
        moveBtn.title = "No packages to move";
      } else {
        moveBtn.title = "Move all packages to another section";
        moveBtn.addEventListener("click", () => {
          moveSectionId = moveSectionId === section.id ? null : section.id;
          render();
        });
      }
      header.appendChild(moveBtn);
    }

    const removeBtn = document.createElement("button");
    removeBtn.className = "section-remove";
    removeBtn.textContent = "✕";
    removeBtn.title = "Delete section";
    removeBtn.addEventListener("click", () => deleteSection(section.id));
    header.appendChild(removeBtn);

    el.appendChild(header);

    if (moveSectionId === section.id) {
      el.appendChild(renderMoveForm(section));
    }

    const addRow = document.createElement("div");
    addRow.className = "add-row";
    const input = document.createElement("input");
    input.type = "text";
    input.placeholder = "Mailbox #";
    input.inputMode = "numeric";
    const addBtn = document.createElement("button");
    addBtn.textContent = "+";
    addBtn.title = "Add";
    const doAdd = () => {
      const value = input.value.trim();
      if (!value) return;
      focusInputSectionId = section.id;
      addPackage(section.id, value);
    };
    addBtn.addEventListener("click", doAdd);
    input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
    addRow.appendChild(input);
    addRow.appendChild(addBtn);
    el.appendChild(addRow);

    const entriesEl = document.createElement("div");
    entriesEl.className = "entries";

    if (section.entries.length === 0) {
      const empty = document.createElement("div");
      empty.className = "empty";
      empty.textContent = "No packages";
      entriesEl.appendChild(empty);
    } else {
      section.entries.forEach(entry => {
        entriesEl.appendChild(renderEntry(section.id, entry));
      });
    }

    el.appendChild(entriesEl);
    return el;
  }

  function renderAddSection() {
    const el = document.createElement("div");
    el.className = "add-section";

    const trigger = document.createElement("button");
    trigger.className = "add-section-trigger";
    trigger.textContent = "+ Add Section";
    trigger.addEventListener("click", () => {
      el.innerHTML = "";
      const form = document.createElement("div");
      form.className = "add-section-form";
      const input = document.createElement("input");
      input.type = "text";
      input.placeholder = "Section name";
      const addBtn = document.createElement("button");
      addBtn.textContent = "Add";
      const doAdd = () => {
        const value = input.value.trim();
        if (!value) return;
        addSection(value);
      };
      addBtn.addEventListener("click", doAdd);
      input.addEventListener("keydown", e => { if (e.key === "Enter") doAdd(); });
      form.appendChild(input);
      form.appendChild(addBtn);
      el.appendChild(form);
      input.focus();
    });

    el.appendChild(trigger);
    return el;
  }

  function renderMoveForm(section) {
    const form = document.createElement("div");
    form.className = "move-form";

    const select = document.createElement("select");
    state.sections
      .filter(s => s.id !== section.id)
      .forEach(s => {
        const opt = document.createElement("option");
        opt.value = s.id;
        opt.textContent = s.name;
        select.appendChild(opt);
      });

    const moveBtn = document.createElement("button");
    moveBtn.className = "save";
    moveBtn.textContent = "Move";
    moveBtn.addEventListener("click", () => {
      moveSectionId = null;
      moveAllToSection(section.id, parseInt(select.value, 10));
    });

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", () => {
      moveSectionId = null;
      render();
    });

    form.appendChild(select);
    form.appendChild(moveBtn);
    form.appendChild(cancelBtn);
    return form;
  }

  function moveAllToSection(sourceId, destId) {
    const source = getSection(sourceId);
    const dest = getSection(destId);
    if (!source || !dest || source.entries.length === 0) return;

    const sourceBefore = source.entries.map(e => ({ ...e }));
    const destBefore = dest.entries.map(e => ({ ...e }));

    source.entries.forEach(entry => {
      const existing = dest.entries.find(e => e.number === entry.number);
      if (existing) {
        existing.qty += entry.qty;
      } else {
        dest.entries.push({ id: nextEntryId++, number: entry.number, qty: entry.qty });
      }
    });
    source.entries = [];
    sortSection(destId);

    save();
    render();
    showUndoToast({
      message: `Moved ${sourceBefore.length} ${sourceBefore.length === 1 ? "number" : "numbers"} from "${source.name}" to "${dest.name}"`,
      undo: () => {
        source.entries = sourceBefore;
        dest.entries = destBefore;
      }
    });
  }

  function startRenameSection(sectionId, header) {
    const section = getSection(sectionId);
    if (!section) return;

    header.innerHTML = "";
    const form = document.createElement("div");
    form.className = "rename-form";

    const nameInput = document.createElement("input");
    nameInput.type = "text";
    nameInput.value = section.name;

    const saveBtn = document.createElement("button");
    saveBtn.className = "save";
    saveBtn.textContent = "Save";
    saveBtn.addEventListener("click", () => commitRenameSection(sectionId, nameInput.value));

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", render);

    nameInput.addEventListener("keydown", e => {
      if (e.key === "Enter") commitRenameSection(sectionId, nameInput.value);
      if (e.key === "Escape") render();
    });

    form.appendChild(nameInput);
    form.appendChild(saveBtn);
    form.appendChild(cancelBtn);
    header.appendChild(form);
    nameInput.focus();
    nameInput.select();
  }

  function commitRenameSection(sectionId, newNameRaw) {
    const newName = newNameRaw.trim();
    if (!newName) return;
    const section = getSection(sectionId);
    if (!section) return;
    section.name = newName;
    save();
    render();
  }

  function addSection(name) {
    state.sections.push({ id: nextSectionId++, name, entries: [] });
    save();
    render();
  }

  let pendingDelete = null;
  let toastTimer = null;

  function deleteSection(sectionId) {
    const idx = state.sections.findIndex(s => s.id === sectionId);
    if (idx === -1) return;
    const [removed] = state.sections.splice(idx, 1);
    const removedIndex = idx;
    save();
    render();
    showUndoToast({
      type: "section",
      message: `Deleted section "${removed.name}"`,
      undo: () => {
        state.sections.splice(removedIndex, 0, removed);
      }
    });
  }

  function renderEntry(sectionId, entry) {
    const row = document.createElement("div");
    row.className = "entry";

    const label = document.createElement("div");
    label.className = "number";
    label.textContent = entry.qty > 1 ? `${entry.number}.${entry.qty}` : entry.number;
    label.title = "Tap to edit";
    label.addEventListener("click", () => startEdit(sectionId, entry.id, row));
    row.appendChild(label);

    const minusBtn = document.createElement("button");
    minusBtn.textContent = "−";
    minusBtn.addEventListener("click", () => changeQty(sectionId, entry.id, -1));
    row.appendChild(minusBtn);

    const plusBtn = document.createElement("button");
    plusBtn.textContent = "+";
    plusBtn.addEventListener("click", () => changeQty(sectionId, entry.id, 1));
    row.appendChild(plusBtn);

    const delBtn = document.createElement("button");
    delBtn.className = "delete";
    delBtn.textContent = "✕";
    delBtn.title = "Delete";
    delBtn.addEventListener("click", () => deleteEntry(sectionId, entry.id));
    row.appendChild(delBtn);

    return row;
  }

  function startEdit(sectionId, id, row) {
    const entry = getSection(sectionId).entries.find(e => e.id === id);
    if (!entry) return;

    row.innerHTML = "";
    const form = document.createElement("div");
    form.className = "edit-form";

    const numberInput = document.createElement("input");
    numberInput.className = "number-field";
    numberInput.type = "text";
    numberInput.value = entry.number;

    const qtyInput = document.createElement("input");
    qtyInput.className = "qty-field";
    qtyInput.type = "number";
    qtyInput.min = "1";
    qtyInput.value = entry.qty;

    const saveBtn = document.createElement("button");
    saveBtn.className = "save";
    saveBtn.textContent = "Save";
    saveBtn.addEventListener("click", () => commitEdit(sectionId, id, numberInput.value, qtyInput.value));

    const cancelBtn = document.createElement("button");
    cancelBtn.className = "cancel";
    cancelBtn.textContent = "Cancel";
    cancelBtn.addEventListener("click", render);

    form.appendChild(numberInput);
    form.appendChild(qtyInput);
    form.appendChild(saveBtn);
    form.appendChild(cancelBtn);
    row.appendChild(form);
    numberInput.focus();
  }

  function commitEdit(sectionId, id, newNumberRaw, newQtyRaw) {
    const parsed = parseNumberInput(newNumberRaw);
    const newNumber = parsed.number;
    if (!newNumber) return;
    let newQty = parsed.qty;
    if (newQty === null) {
      newQty = parseInt(newQtyRaw, 10);
      if (isNaN(newQty) || newQty < 1) newQty = 1;
    }

    const list = getSection(sectionId).entries;
    const entry = list.find(e => e.id === id);
    if (!entry) return;

    const duplicate = list.find(e => e.id !== id && e.number === newNumber);
    if (duplicate) {
      duplicate.qty += newQty;
      const idx = list.indexOf(entry);
      list.splice(idx, 1);
    } else {
      entry.number = newNumber;
      entry.qty = newQty;
    }

    sortSection(sectionId);
    save();
    render();
  }

  function addPackage(sectionId, rawNumber) {
    const parsed = parseNumberInput(rawNumber);
    const list = getSection(sectionId).entries;
    const existing = list.find(e => e.number === parsed.number);
    if (existing) {
      existing.qty += 1;
    } else {
      list.push({ id: nextEntryId++, number: parsed.number, qty: parsed.qty || 1 });
    }
    sortSection(sectionId);
    save();
    render();
  }

  function changeQty(sectionId, id, delta) {
    const entry = getSection(sectionId).entries.find(e => e.id === id);
    if (!entry) return;
    entry.qty = Math.max(1, entry.qty + delta);
    save();
    render();
  }

  function deleteEntry(sectionId, id) {
    const list = getSection(sectionId).entries;
    const idx = list.findIndex(e => e.id === id);
    if (idx === -1) return;
    const [removed] = list.splice(idx, 1);
    save();
    render();
    showUndoToast({
      type: "entry",
      message: `Deleted mailbox ${removed.number} from ${getSection(sectionId).name}`,
      undo: () => {
        list.push(removed);
        sortSection(sectionId);
      }
    });
  }

  function showUndoToast(action) {
    pendingDelete = action;
    const toast = document.getElementById("toast");
    const msg = document.getElementById("toast-msg");
    msg.textContent = action.message;
    toast.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => {
      toast.classList.remove("show");
      pendingDelete = null;
    }, 5000);
  }

  document.getElementById("toast-undo").addEventListener("click", () => {
    if (!pendingDelete) return;
    pendingDelete.undo();
    save();
    render();
    document.getElementById("toast").classList.remove("show");
    clearTimeout(toastTimer);
    pendingDelete = null;
  });

  state.sections.forEach(s => sortSection(s.id));
  render();
})();
</script>
</body>
</html>
